server:
  port: 8080

spring:
  application:
    name: saigon-plan-travel-backend
  datasource:
    url: ${JDBC_DB_URL}
    username: ${JDBC_DB_USERNAME}
    password: ${JDBC_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

app:
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
  security:
    cors:
      allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
    jwt:
      secret: ${JWT_SECRET}
      issuer: saigon-plan-travel
      access-token-expiration: PT1H
