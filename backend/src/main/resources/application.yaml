server:
  port: 8080

spring:
  application:
    name: saigon-plan-travel-backend
  datasource:
    url: ${JDBC_DB_URL}
    username: ${JDBC_DB_USERNAME}
    password: ${JDBC_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 10s
logging:
  level:
    org.hibernate.SQL: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

app:
  media:
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
  geocoding:
    base-url: ${GEOAPIFY_BASE_URL:https://api.geoapify.com}
    api-key: ${GEOAPIFY_API_KEY:}
  security:
    cors:
      allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
    jwt:
      secret: ${JWT_SECRET}
      issuer: saigon-plan-travel
      access-token-expiration: PT1H
