<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Admin login')}">
    <title>Admin login</title>
</head>
<body class="d-flex align-items-center py-5">
<main class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-9 col-md-7 col-lg-5 col-xl-4">
            <div class="card page-card">
                <div class="card-body p-4 p-md-5">
                    <p class="text-primary fw-semibold mb-2">Saigon Plan Travel</p>
                    <h1 class="h3 mb-3">Admin login</h1>
                    <p class="text-secondary mb-4">Sign in with your administrator account.</p>
                    <div class="alert alert-danger" role="alert" th:if="${param.error}">
                        Invalid email or password.
                    </div>
                    <div class="alert alert-success" role="alert" th:if="${param.logout}">
                        You have been signed out.
                    </div>
                    <form method="post" th:action="@{/admin/login}">
                        <div class="mb-3">
                            <label class="form-label" for="email">Email</label>
                            <input class="form-control" id="email" name="email" type="email"
                                   autocomplete="username" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="password">Password</label>
                            <input class="form-control" id="password" name="password" type="password"
                                   autocomplete="current-password" required>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Sign in</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
